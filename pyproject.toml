[project]
name = "news-token-radar"
version = "0.1.0"
description = "News-to-Token Signal Radar para fomo.family: noticias de último momento -> memecoins -> alertas"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.15",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=14",
    "rapidfuzz>=3.9",
    "feedparser>=6.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
browser = ["playwright>=1.47"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
news-token-radar = "radar.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["radar*"]
