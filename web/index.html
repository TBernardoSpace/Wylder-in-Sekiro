<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Radar · fomo.family</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #07090c; --panel: #0d1117; --panel-2: #121821; --line: #1e2732; --text: #d6dde6;
    --muted: #7d8a99; --green: #2ee59d; --green-dim: #0f3d2c; --red: #ff5c6c; --red-dim: #3d1218;
    --amber: #ffb84d; --amber-dim: #3d2c0f; --blue: #5cb8ff; --blue-dim: #10283d; --violet: #b18cff;
    --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 var(--mono); }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line);
           background: linear-gradient(180deg, #0b0f14, var(--bg)); flex-wrap: wrap; }
  .brand { font-weight: 700; letter-spacing: .5px; color: var(--green); }
  .brand span { color: var(--muted); font-weight: 400; }
  .pill { padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 11px; white-space: nowrap; }
  .pill b { color: var(--text); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--red); margin-right: 6px; vertical-align: middle; }
  .dot.on { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .spacer { flex: 1; }
  button, .btn { font: inherit; font-size: 12px; color: var(--text); background: var(--panel-2); border: 1px solid var(--line);
                 border-radius: 6px; padding: 4px 10px; cursor: pointer; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
  button:hover, .btn:hover { border-color: var(--muted); }
  .btn.buy { background: var(--green-dim); border-color: var(--green); color: var(--green); font-weight: 700; }
  #sound.armed { border-color: var(--green); color: var(--green); }
  main { display: grid; grid-template-columns: 1fr 1fr 1.25fr; gap: 1px; background: var(--line); height: calc(100% - 50px); }
  section { background: var(--panel); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  section h2 { margin: 0; padding: 10px 14px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
               border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  section h2 .count { color: var(--text); }
  .list { overflow-y: auto; flex: 1; padding: 6px; }
  .item { padding: 8px 10px; border: 1px solid transparent; border-bottom-color: var(--line); animation: flash 1.2s ease-out; overflow-wrap: anywhere; }
  .item:hover { background: var(--panel-2); }
  @keyframes flash { from { background: #1b2a22; } to { background: transparent; } }
  .meta { color: var(--muted); font-size: 11px; display: flex; gap: 10px; flex-wrap: wrap; margin-top: 3px; }
  .title { color: var(--text); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .chip { font-size: 10.5px; padding: 0 6px; border-radius: 4px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
  .chip.tk { color: var(--blue); border-color: var(--blue-dim); }
  .chip.llm { color: var(--violet); border-color: #2c2147; }
  .sym { color: var(--amber); font-weight: 700; }
  .chain { font-size: 10px; text-transform: uppercase; padding: 0 5px; border-radius: 3px; background: var(--blue-dim); color: var(--blue); }
  .fomo { font-size: 10px; padding: 0 5px; border-radius: 3px; background: var(--green-dim); color: var(--green); }
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin-top: 6px; }
  .kv { background: var(--panel-2); border-radius: 4px; padding: 3px 6px; min-width: 0; }
  .kv small { display: block; color: var(--muted); font-size: 10px; }
  .kv b { font-weight: 600; }
  .up { color: var(--green); } .down { color: var(--red); }
  .sig { margin: 6px 4px 10px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--panel-2); animation: flash 1.2s ease-out; overflow-wrap: anywhere; }
  .sig.confirmed { border-color: var(--green); box-shadow: 0 0 0 1px var(--green-dim), 0 0 18px -6px var(--green); }
  .sig.secondary { border-color: var(--blue-dim); }
  .sig.watch { border-color: var(--amber-dim); }
  .sig.rejected { opacity: .55; border-color: var(--red-dim); }
  .sig-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .score { font-size: 22px; font-weight: 800; color: var(--green); }
  .sig.watch .score { color: var(--amber); } .sig.rejected .score { color: var(--red); } .sig.secondary .score { color: var(--blue); }
  .badge { font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 4px; letter-spacing: .5px; }
  .b-confirmed { background: var(--green-dim); color: var(--green); }
  .b-secondary { background: var(--blue-dim); color: var(--blue); }
  .b-watch { background: var(--amber-dim); color: var(--amber); }
  .b-rejected { background: var(--red-dim); color: var(--red); }
  .news-ref { margin-top: 6px; padding-left: 8px; border-left: 2px solid var(--line); color: var(--muted); }
  .about { margin-top: 5px; font-size: 11px; color: var(--muted); }
  .about a { color: var(--blue); }
  .flow { margin-top: 6px; font-size: 11.5px; color: #ff9d5c; }
  .flow b { color: #ffc29a; }
  .reason { margin-top: 6px; color: var(--violet); font-style: italic; }
  .warn { color: var(--amber); font-size: 11.5px; margin-top: 4px; }
  .bad { color: var(--red); font-size: 11.5px; margin-top: 4px; }
  .ca { margin-top: 8px; display: flex; gap: 6px; align-items: center; }
  .ca code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted);
             background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; }
  .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .empty { color: var(--muted); padding: 20px 12px; text-align: center; }
  .filters { display: flex; gap: 4px; }
  .filters button { padding: 1px 7px; font-size: 10.5px; }
  .filters button.active { border-color: var(--green); color: var(--green); }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--green-dim); color: var(--green);
           border: 1px solid var(--green); padding: 6px 14px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  @media (max-width: 1100px) {
    main { grid-template-columns: 1fr; height: auto; }
    section { max-height: 70vh; }
    #col-signals { order: -1; }
    header { padding: 10px 16px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">◉ SIGNAL RADAR <span>news → token · fomo.family</span></div>
  <span class="pill"><span id="ws-dot" class="dot"></span><span id="ws-label">desconectado</span></span>
  <span class="pill">LLM <b id="cfg-llm">—</b></span>
  <span class="pill">umbral <b id="cfg-th">—</b></span>
  <span class="pill">liq mín <b id="cfg-liq">—</b></span>
  <span class="pill" id="cfg-demo" hidden><b>DEMO</b></span>
  <div class="spacer"></div>
  <span class="pill" id="sources" title="estado de conectores">fuentes: —</span>
  <button id="sound" title="Los navegadores exigen un clic para habilitar audio">🔇 Activar sonido</button>
</header>
<main>
  <section id="col-news">
    <h2>Últimas noticias procesadas <span class="count" id="n-news">0</span></h2>
    <div class="list" id="news"><div class="empty">Esperando noticias…</div></div>
  </section>
  <section id="col-tokens">
    <h2>Tokens detectados <span class="filters"><button id="traction" class="active" title="Oculta lanzamientos sin liquidez/volumen ni compras FOMO">con tracción</button></span><span class="count" id="n-tokens">0</span></h2>
    <div class="list" id="tokens"><div class="empty">Esperando tokens…</div></div>
  </section>
  <section id="col-signals">
    <h2>Señales de compra (matches)
      <span class="filters" id="filters">
        <button data-f="all" class="active">todas</button><button data-f="confirmed">confirmadas</button><button data-f="watch">watch</button>
      </span>
    </h2>
    <div class="list" id="signals"><div class="empty">Sin matches todavía.</div></div>
  </section>
</main>
<div id="toast"></div>
<script>
const state = { news: [], tokens: new Map(), signals: new Map(), status: {}, filter: "all", soundOn: false, booted: false };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const usd = (v) => v == null ? "n/d" : Math.abs(v) >= 1e9 ? `$${(v/1e9).toFixed(2)}B` : Math.abs(v) >= 1e6 ? `$${(v/1e6).toFixed(2)}M` : Math.abs(v) >= 1e3 ? `$${(v/1e3).toFixed(1)}K` : `$${Math.round(v)}`;
const ago = (iso) => { if (!iso) return "n/d"; const s = (Date.now() - new Date(iso).getTime()) / 1000;
  return s < 60 ? `${Math.max(0, Math.floor(s))}s` : s < 3600 ? `${Math.floor(s/60)}m` : `${(s/3600).toFixed(1)}h`; };
const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? esc(u) : "#";

// ---------- Sonido (WebAudio, sin archivos) ----------
let audio;
$("sound").onclick = () => {
  state.soundOn = !state.soundOn;
  if (state.soundOn) { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); beep(); }
  $("sound").textContent = state.soundOn ? "🔊 Sonido activo" : "🔇 Activar sonido";
  $("sound").classList.toggle("armed", state.soundOn);
  if (state.soundOn && "Notification" in window && Notification.permission === "default") Notification.requestPermission();
};
function beep(urgent = false) {
  if (!state.soundOn || !audio) return;
  const notes = urgent ? [880, 1320, 880, 1320] : [660];
  notes.forEach((f, i) => {
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i * 0.16;
    o.type = "square"; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + 0.15);
  });
}
function notify(sig) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const t = sig.token;
  new Notification(`🚨 ${t.name} ($${t.symbol}) · ${Math.round(sig.match_score)}/100`, { body: sig.news.headline, tag: sig.id });
}
function toast(msg) { const el = $("toast"); el.textContent = msg; el.style.opacity = 1; setTimeout(() => el.style.opacity = 0, 1400); }
async function copyCA(ca) {
  try { await navigator.clipboard.writeText(ca); toast("CA copiado ✔"); }
  catch { const ta = document.createElement("textarea"); ta.value = ca; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("CA copiado ✔"); }
}
document.addEventListener("click", (e) => { const b = e.target.closest("[data-copy]"); if (b) copyCA(b.dataset.copy); });
$("filters").onclick = (e) => { const b = e.target.closest("button"); if (!b) return;
  state.filter = b.dataset.f; [...$("filters").children].forEach((x) => x.classList.toggle("active", x === b)); renderSignals(); };

// ---------- Render ----------
function renderNews() {
  $("n-news").textContent = state.news.length;
  if (!state.news.length) return;
  $("news").innerHTML = state.news.slice(0, 120).map((n) => `
    <div class="item">
      <div class="title">${n.url ? `<a href="${safeUrl(n.url)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${esc(n.headline)}</a>` : esc(n.headline)}</div>
      <div class="meta"><span>${esc(n.source)}</span><span data-ago="${esc(n.published_at)}">${ago(n.published_at)}</span>
        <span class="chip ${n.extractor === "llm" ? "llm" : ""}">${esc(n.extractor)}</span>
        ${n.meme_potential != null ? `<span>meme ${n.meme_potential}</span>` : ""}</div>
      <div class="chips">${(n.potential_tickers || []).slice(0, 10).map((t) => `<span class="chip tk">$${esc(t)}</span>`).join("")}</div>
      <div class="chips">${(n.keywords || []).slice(0, 8).map((k) => `<span class="chip">${esc(k)}</span>`).join("")}</div>
    </div>`).join("");
}
// Compras hechas desde la app FOMO (Vía D, on-chain) en los últimos 5 min
const flow = (t) => t.fomo_buyers_5m ? `<div class="flow">🔥 FOMO 5m: <b>${t.fomo_buyers_5m}</b> traders · ${t.fomo_buys_5m} compras` +
  `${t.fomo_sells_5m ? ` / ${t.fomo_sells_5m} ventas` : ""} · ${usd(t.fomo_volume_usd_5m)}</div>` : "";
// Descripción y links que puso el creador (pump.fun / IPFS)
const about = (t) => (t.description || t.twitter || t.website) ? `<div class="about">${t.description ? esc(t.description.slice(0, 140)) : ""}` +
  `${t.twitter ? ` <a href="${safeUrl(t.twitter)}" target="_blank" rel="noopener">𝕏</a>` : ""}` +
  `${t.website ? ` <a href="${safeUrl(t.website)}" target="_blank" rel="noopener">web</a>` : ""}</div>` : "";
function tokenCard(t) {
  return `<div class="item">
    <div><span class="sym">$${esc(t.symbol)}</span> ${esc(t.name)} <span class="chain">${esc(t.chain)}</span> ${t.on_fomo ? '<span class="fomo">FOMO</span>' : ""}</div>
    <div class="grid4">
      <div class="kv"><small>MC</small><b>${usd(t.market_cap)}</b></div>
      <div class="kv"><small>Liq</small><b>${usd(t.liquidity_usd)}</b></div>
      <div class="kv"><small>Vol 5m</small><b>${usd(t.volume_5m)}</b></div>
      <div class="kv"><small>Holders</small><b>${t.holder_count ?? "n/d"}</b></div>
    </div>
    ${flow(t)}${about(t)}
    <div class="meta"><span>creado <span data-ago="${esc(t.created_at || t.first_seen)}">${ago(t.created_at || t.first_seen)}</span></span><span>${esc(t.source)}</span>
      <a href="${safeUrl(t.dexscreener_url)}" target="_blank" rel="noopener" style="color:var(--blue)">dex</a>
      <a href="#" data-copy="${esc(t.token_address)}" style="color:var(--muted)" onclick="return false">copiar CA</a></div>
  </div>`;
}
const hasTraction = (t) => (t.liquidity_usd || 0) >= 1000 || (t.volume_5m || 0) >= 500 || (t.fomo_buyers_5m || 0) > 0;
let tractionOnly = true;
$("traction").onclick = () => { tractionOnly = !tractionOnly; $("traction").classList.toggle("active", tractionOnly); renderTokens(); };
function renderTokens() {
  const list = [...state.tokens.values()].filter((t) => !tractionOnly || hasTraction(t))
    .sort((a, b) => new Date(b.first_seen) - new Date(a.first_seen)).slice(0, 150);
  $("n-tokens").textContent = `${list.length}/${state.tokens.size}`;
  $("tokens").innerHTML = list.length ? list.map(tokenCard).join("") : '<div class="empty">Sin tokens con tracción todavía.</div>';
}
const LABEL = { confirmed: "CONFIRMADA", secondary: "SECUNDARIA", watch: "WATCH", rejected: "DESCARTADA" };
function signalCard(s) {
  // métricas en vivo: si el scanner trae datos más nuevos del token, se usan esos
  const t = { ...s.token, ...(state.tokens.get(s.token.key) || {}) }, n = s.news, sf = s.safety || {};
  const trend = { up: '<span class="up">↑</span>', down: '<span class="down">↓</span>', flat: "→" }[sf.volume_trend] || "?";
  return `<div class="sig ${s.status}">
    <div class="sig-top">
      <div><span class="badge b-${s.status}">${LABEL[s.status] || s.status}${s.is_leader ? " · LÍDER" : ""}${s.alerted ? " · 🔔" : ""}</span>
        <div style="margin-top:4px"><span class="sym" style="font-size:15px">$${esc(t.symbol)}</span> ${esc(t.name)} <span class="chain">${esc(t.chain)}</span> ${t.on_fomo ? '<span class="fomo">FOMO</span>' : ""}</div></div>
      <div style="text-align:right"><div class="score">${Math.round(s.match_score)}</div>
        <div class="meta" style="justify-content:flex-end">fuzzy ${Math.round(s.fuzzy_score)}${s.llm_score != null ? ` · llm ${s.llm_score}` : ""}</div></div>
    </div>
    <div class="news-ref">📰 ${esc(n.headline)}<div class="meta"><span>${esc(n.source)}</span><span data-ago="${esc(n.published_at)}">${ago(n.published_at)}</span></div></div>
    <div class="grid4">
      <div class="kv"><small>MC</small><b>${usd(t.market_cap)}</b></div>
      <div class="kv"><small>Liq</small><b>${usd(t.liquidity_usd)}</b></div>
      <div class="kv"><small>Vol 5m</small><b>${usd(t.volume_5m)} ${trend}</b></div>
      <div class="kv"><small>Holders</small><b>${t.holder_count ?? "n/d"}</b></div>
    </div>
    ${flow(t)}${about(t)}
    ${s.reason ? `<div class="reason">🧠 ${esc(s.reason)}</div>` : ""}
    ${(sf.reasons || []).map((r) => `<div class="bad">✖ ${esc(r)}</div>`).join("")}
    ${(sf.warnings || []).map((w) => `<div class="warn">${esc(w)}</div>`).join("")}
    <div class="ca"><code title="${esc(t.token_address)}">${esc(t.token_address)}</code><button data-copy="${esc(t.token_address)}">📋 CA</button></div>
    <div class="actions">
      <a class="btn buy" href="${safeUrl(t.fomo_url)}" target="_blank" rel="noopener">🟢 Comprar en Fomo</a>
      <a class="btn" href="${safeUrl(t.dexscreener_url)}" target="_blank" rel="noopener">📈 DexScreener</a>
      ${n.url ? `<a class="btn" href="${safeUrl(n.url)}" target="_blank" rel="noopener">📰 Noticia</a>` : ""}
    </div>
  </div>`;
}
const ORDER = { confirmed: 0, secondary: 1, watch: 2, rejected: 3 };
function renderSignals() {
  let list = [...state.signals.values()];
  if (state.filter !== "all") list = list.filter((s) => s.status === state.filter);
  list.sort((a, b) => (ORDER[a.status] - ORDER[b.status]) || (new Date(b.created_at) - new Date(a.created_at)));
  $("signals").innerHTML = list.length ? list.map(signalCard).join("") : '<div class="empty">Sin matches todavía.</div>';
}
function renderStatus() {
  const entries = Object.entries(state.status);
  const ok = entries.filter(([, v]) => v.ok).length;
  $("sources").textContent = `fuentes: ${ok}/${entries.length} OK`;
  $("sources").title = entries.map(([k, v]) => `${v.ok ? "✔" : "✖"} ${k}${v.error ? " — " + v.error : ""}`).join("\n");
}
let pending = {};
function schedule(what) { pending[what] = true; requestAnimationFrame(() => {
  if (pending.news) renderNews(); if (pending.tokens) renderTokens(); if (pending.signals) renderSignals(); if (pending.status) renderStatus(); pending = {}; }); }

// ---------- WebSocket ----------
function handle(msg) {
  const d = msg.data;
  switch (msg.type) {
    case "snapshot":
      state.news = d.news; state.tokens = new Map(d.tokens.map((t) => [t.key, t]));
      state.signals = new Map(d.signals.map((s) => [s.id, s])); state.status = d.status || {};
      $("cfg-llm").textContent = d.config.llm || "off (fuzzy)"; $("cfg-th").textContent = d.config.match_threshold;
      $("cfg-liq").textContent = usd(d.config.min_liquidity_usd); $("cfg-demo").hidden = !d.config.demo;
      state.booted = true; renderNews(); renderTokens(); renderSignals(); renderStatus(); break;
    case "news": state.news.unshift(d); state.news = state.news.slice(0, 150); schedule("news"); break;
    case "token": case "token_update": state.tokens.set(d.key, d); schedule("tokens");
      if ([...state.signals.values()].some((x) => x.token.key === d.key)) schedule("signals"); break;
    case "signal": {
      const prev = state.signals.get(d.id);
      state.signals.set(d.id, d); schedule("signals");
      if (state.booted && d.alerted && !(prev && prev.alerted)) { beep(true); notify(d); }
      else if (!prev && d.status === "watch") beep(false);
      break; }
    case "status": state.status[d.component] = d; schedule("status"); break;
  }
}
let backoff = 1000;
function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onopen = () => { backoff = 1000; $("ws-dot").classList.add("on"); $("ws-label").textContent = "en vivo"; };
  ws.onmessage = (e) => handle(JSON.parse(e.data));
  ws.onclose = () => { $("ws-dot").classList.remove("on"); $("ws-label").textContent = "reconectando…";
    setTimeout(connect, backoff); backoff = Math.min(backoff * 2, 15000); };
}
connect();
setInterval(() => document.querySelectorAll("[data-ago]").forEach((el) => el.textContent = ago(el.dataset.ago)), 5000);
</script>
</body>
</html>
